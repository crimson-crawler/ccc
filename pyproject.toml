[project]
name = "crimson-crawler-cli"
version = "5.0.0"
description = "Command-line interface for the Crimson Crawler API"
dynamic = ["readme"]  # supplied by hatch_build.py:PackagedReadmeUrls
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Def-Logix, Inc." }]
keywords = ["cti", "threat-intelligence", "cli", "crimson-crawler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "defusedxml>=0.7",
    "packageurl-python>=0.15",
    "crimson-crawler-client>=5.0,<6.0",
]

[project.urls]
Homepage = "https://crimsoncrawler.com"
Repository = "https://github.com/crimson-crawler/ccc"
Documentation = "https://crimsoncrawler.com/docs/clients/cli/"

[tool.uv]
# Security floor for a transitive dep (CC-9.1 pattern used by the root pyproject):
# certifi arrives via httpx (through crimson-crawler-client). The lock is the pin;
# this floor keeps a re-lock from silently resolving a vulnerable certifi
# (GHSA-6q48-6c7w-9gw2).
constraint-dependencies = [
    "certifi>=2026.10.19",
]

# uv-only override: build the CLI against the in-repo SDK during development.
# `uv` strips this table when constructing the published wheel, so consumers
# install `crimson-crawler-client` from PyPI as usual.
[tool.uv.sources]
crimson-crawler-client = { git = "https://github.com/crimson-crawler/python-sdk.git", tag = "v5.0.0" }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=1.19,<2",
    "hatchling>=1.27,<2",
    "twine==6.2.0",
]

[project.scripts]
ccc = "crimson_crawler_cli.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crimson_crawler_cli"]

[tool.hatch.build.targets.sdist]
# Mirrors client-py: LICENSE and NOTICE also arrive via `license-files`, but naming
# them keeps the sdist explicit. hatch_build.py ships because the sdist must be able
# to rebuild a wheel under build isolation, which needs the metadata hook present.
include = ["src/crimson_crawler_cli", "README.md", "LICENSE", "NOTICE", "hatch_build.py", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["crimson_crawler_cli"]

# 90% floor on the public command surface (matches the SDK gates). Measured 2026-09-21:
# 94.3% total, and crawl.py — the reason this was briefly lowered to 80 — is at 92%, so
# the floor no longer needs slack for it.
[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src/crimson_crawler_cli"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# Per-module, not tree-wide: the four `commands/` renderers unwrap the SDK's nullable report
# fields through chains of `.get()`, so `union-attr`/`arg-type` fire on values each of them has
# already defaulted with `isinstance(...)`. `no-redef` is the two same-named nested `_call`
# closures in `inventory_manager.py`. Silencing these three codes here keeps every other module —
# and every module added later — under full checking.
[[tool.mypy.overrides]]
module = [
    "crimson_crawler_cli.commands._formatters",
    "crimson_crawler_cli.commands.enrich_artifact",
    "crimson_crawler_cli.commands.enrich_event",
    "crimson_crawler_cli.commands.inventory_manager",
]
disable_error_code = ["arg-type", "no-redef", "union-attr"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
# Declared rather than inferred (matching the Python SDK) so the same tree lints
# identically wherever it is built — development checkout, CI image, or the
# published repository.
known-first-party = ["crimson_crawler_cli", "crimson_crawler_client"]
